name: CI

# Every commit is linted; the heavier `tests` job stays scoped to `develop`
# and pull requests (see its `if:` condition).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: develop-beveren_health-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    # Full bench install + unit tests: only for pull requests and `develop`.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app beveren_health $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app beveren_health
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app beveren_health
        env:
          TYPE: server

  linters:
    name: 'Frappe Linter (pre-commit + Semgrep)'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Semgrep diffs the change against the previous commit / PR base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Resolve Semgrep baseline commit
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          case "$base" in
            "" | 0000000000000000000000000000000000000000)
              # New branch: compare against the default branch.
              base="$(git merge-base "origin/${{ github.event.repository.default_branch }}" HEAD || true)"
              ;;
          esac
          echo "SEMGREP_BASELINE_COMMIT=$base" >> "$GITHUB_ENV"
          echo "Semgrep baseline: ${base:-<whole tree>}"

      - name: Check for "[skip semgrep]" marker
        id: semgrep_marker
        run: |
          if git log -1 --pretty=%B | grep -qiF '[skip semgrep]'; then
            # Escape hatch for one-off commits that reformat whole files (for
            # example the first `pre-commit run --all-files`): semgrep's baseline
            # matches changed lines, so a reformat makes the pre-existing
            # findings in those files look new.
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Found [skip semgrep] in $(git log -1 --pretty=%h) - skipping the Semgrep check."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pre-commit (Semgrep hook)
        # Only the semgrep hook is run here: it reports the findings introduced
        # by the commit/PR (see scripts/run_semgrep.sh). The remaining hooks
        # still have pre-existing findings when run on the whole tree; they are
        # executed on pull requests by .github/workflows/linter.yml.
        if: steps.semgrep_marker.outputs.skip != 'true'
        run: pre-commit run semgrep --all-files
